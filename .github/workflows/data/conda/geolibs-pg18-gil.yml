name: geodjango
channels:
  - conda-forge
dependencies:
  - python-gil=3.14
  - postgresql=18.*
  - postgis=3.6.*
  - libgdal=3.13.*
  - geos=3.14.*
  - proj=9.8.*
  - pip=26.*
  - pip:
      - -r ../../../../tests/requirements/py3.txt
      - -r ../../../../tests/requirements/postgres.txt
      - -e ../../../../
