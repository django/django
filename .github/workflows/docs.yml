name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'tests/sphinx_tests/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'tests/sphinx_tests/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install system spell checker
        run: sudo apt update && sudo apt install -y --no-install-recommends aspell aspell-en
      - run: python -m pip install --group=../pyproject.toml:docs
      - name: Lint
        run: make lint
      - name: Black
        run: make black
      - name: Spelling
        run: SPHINXOPTS="-q -W" make spelling
      - name: EPUBCheck
        run: SPHINXOPTS="-q" make epubcheck

  sphinx-extension-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - name: Install docs dependencies and Django
        run: python -m pip install --group=docs -e .
      - name: Run tests for Sphinx extensions
        run: python -Wall tests/runtests.py -v2 sphinx_tests
