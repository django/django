name: Playwright artifacts

inputs:
  browser:
    required: true
  sha:
    required: true
  path:
    required: true
  artifact-name:
    required: true

runs:
  using: composite
  steps:
    - name: Organize Playwright artifacts
      shell: bash
      run: |
        mkdir --parents "${{ inputs.path }}/${{ inputs.sha }}"
        if [ -d "tests/videos/${{ inputs.browser }}" ]; then
          mv "tests/videos/${{ inputs.browser }}" "${{ inputs.path }}/${{ inputs.sha }}/videos"
        fi
        if [ -d "tests/traces/${{ inputs.browser }}" ]; then
          mv "tests/traces/${{ inputs.browser }}" "${{ inputs.path }}/${{ inputs.sha }}/traces"
        fi

    - name: Upload Playwright artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.path }}/
        if-no-files-found: ignore
